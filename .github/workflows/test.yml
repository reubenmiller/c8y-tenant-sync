name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Validate extension
        run: |
          go build -o bin/c8y-tenant-sync .
          go run github.com/reubenmiller/go-c8y-cli/v2/cmd/c8y@latest extensions validate . --strict
