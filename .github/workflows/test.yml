name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # sops and age run the sops round trip test (skipped when missing)
      - name: Install sops and age
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q age
          sudo curl -fsSL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo chmod +x /usr/local/bin/sops
          sops --version
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Test
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | tee test.log
      - name: Check the sops round trip ran
        run: grep -q -- "--- PASS: TestSopsAgeRoundTrip" test.log
      - name: Validate extension
        run: |
          go build -o bin/c8y-tenant-sync .
          go run github.com/reubenmiller/go-c8y-cli/v2/cmd/c8y@latest extensions validate . --strict
