# yaml-language-server: $schema=https://raw.githubusercontent.com/reubenmiller/c8y-tenant-sync/main/tenant.schema.json
#
# Example tenant-sync manifest
#
# Validate with: c8y tenant-sync validate tenant.yaml
# Preview with:  c8y tenant-sync run -f tenant.yaml --dry-run
# Apply with:    c8y tenant-sync run -f tenant.yaml
#
# Environment variables are expanded with ${VAR} syntax before parsing,
# so secrets (e.g. GitHub tokens) can be injected from the environment.

# Merge other manifest files before this file's content: paths or glob
# patterns relative to this file. List sections are concatenated (includes
# first); entries with the same identity (e.g. tenant option category+key,
# user group name) and the targets and certificateAuthority sections of a
# later file replace earlier ones. Relative source paths in an included file
# are resolved against that file's directory.
# include:
#   - base/common.yaml                    # a missing file is an error
#   - path: "customers/*.yaml"            # glob matches are merged sorted by name
#   - path: local-overrides.yaml
#     optional: true                      # skip when missing / nothing matches
#   - https://example.com/repo/base.yaml   # a manifest from a URL
#   - github:                             # a bundle (manifest + files) from a
#       repo: org/tenant-blueprints       # GitHub release asset, see
#       release: v1.2.0                   # "c8y tenant-sync bundle"
#       assets: ["blueprint-*.tar.gz"]

# Apply the manifest to other tenants than the current one. Selection modes
# are additive (union of all matches) and overridable on the command line
# (--target, --all-children, --target-selector, --include-current).
# Credentials for the other tenants come from a placeholder microservice's
# per-tenant service users (serviceUser mode, default) or from go-c8y-cli
# session files (sessions mode).
# targets:
#   current: false      # include the current tenant (default: only when nothing else is selected)
#   allChildren: true   # all child tenants of the current tenant
#   tenants: [t12345, child.example.com] # by ID or domain
#   selector:
#     domain: "*.iot.example.com" # glob matched against the tenant domain
#     company: ACME               # exact company name
#   credentials:
#     mode: serviceUser           # serviceUser (default) | sessions | tenantAdmin (admin credentials of the tenants section)
#     application: tenant-sync    # placeholder microservice name (serviceUser mode)

# Provision child tenants from a management or enterprise tenant (most tenants
# can't create child tenants, so the example is commented out). Tenants are
# matched by domain: a missing tenant is created, an existing tenant gets its
# company, contact and custom properties updated when they differ. Admin
# credentials are only used on creation, and tenants are never deleted. The
# section runs once before the targets are resolved, so targets.tenants can
# select a tenant created in the same run.
# tenants:
#   - domain: customer-a.eu-latest.cumulocity.com   # unique key: the full domain
#     id: customer-a                                  # optional tenant ID (generated when omitted)
#     company: Customer A
#     adminName: admin
#     adminEmail: admin@customer-a.example.com
#     adminPasswordFrom:
#       generate: customer-a-admin    # or adminPass: ${VAR}, or sendPasswordResetEmail: true
#     contactName: Jane Doe
#     contactPhone: "+49 123 456"
#     customProperties:
#       externalReference: CRM-1234
#     applications: [devicemanagement, cockpit]    # subscribed when missing

# Set tenant options (created if missing, updated when the value differs)
tenantOptions:
  - category: configuration
    key: device.bootstrap.enabled
    value: "true"

  # Values can also be resolved by lookup at apply time, e.g. an application
  # ID looked up by name
  - category: application
    key: default.application
    valueFrom:
      application: devicemanagement

  # A secret from an environment variable (or generate: NAME for a generated
  # value); it must be set when the manifest is applied
  - category: integration
    key: api.secret
    valueFrom:
      env: INTEGRATION_SECRET

# Enable/disable feature toggles for the current tenant
features:
  - key: feature-branding
  - key: feature-cep-custom-rules
    enabled: false

# Ensure retention rules exist. Rules have no name: they are matched by the
# selector combination (dataType/fragmentType/type/source, wildcards default
# to "*") and maximumAge is updated when it differs.
retentionRules:
  - dataType: MEASUREMENT
    maximumAge: 365 # days
  - dataType: EVENT
    type: c8y_LocationUpdate
    maximumAge: 30
  - dataType: ALARM
    maximumAge: 90
    editable: false # lock the rule in the UI

# Enable the tenant's Cumulocity certificate authority (CA), creating it when
# it does not exist. enabled: false disables the CA certificate (it is never
# deleted, since that would invalidate every certificate it issued)
certificateAuthority:
  enabled: true
  autoRegistrationEnabled: true # optional; left untouched when omitted

# Upload trusted device certificates (PEM or DER) into the tenant trust
# store. Certificates are matched by fingerprint: missing ones are uploaded,
# and the name/status/autoRegistrationEnabled of existing ones are updated
# when they differ. Certificates are never deleted.
trustedCertificates:
  # Scan a directory (*.pem, *.crt, *.cer by default); names default to the
  # certificate subject common name
  - autoRegistrationEnabled: true
    source:
      path: ./certificates
      optional: true # skip instead of failing when the directory is missing

  # A single certificate with an explicit name, kept uploaded but disabled
  - name: legacy-factory-ca
    status: DISABLED
    source:
      path: ./certificates/archive/legacy-factory-ca.pem
      optional: true

# Upload certificate revocation entries from CSV files (header
# SERIALNO[,DATE]; one certificate serial number in hex per row). Uploads are
# additive: entries already on the tenant revocation list are never removed.
certificateRevocationLists:
  - source:
      path: ./certificates/revoked.csv
      optional: true

# Subscribe microservices to the target tenant (idempotent)
microservices:
  - name: advanced-software-mgmt

  # subscribed: false unsubscribes the microservice. (Un)subscribing a
  # microservice not owned by the current tenant requires running from the
  # owner (parent) tenant, e.g. with a targets section.
  - name: cloud-remote-access
    subscribed: false

  # With a source, the microservice is created if missing and its binary (zip)
  # uploaded when it has none or the source version differs (or with --force)
  - name: my-microservice
    source:
      path: ./build/my-microservice.zip
      optional: true # skip instead of failing when the file does not exist

# Upload UI extensions (plugin packages) into the tenant running the sync. A
# version is only uploaded when it is not on the extension yet (the version
# comes from the archive filename, the release tag or the cumulocity.json).
# Install them into web applications with applications[].extensions.
extensions:
  - name: my-widget-plugin
    source:
      path: ./build/my-widget-plugin-1.0.0.zip
      optional: true

# Subscribe web applications to the target tenant (idempotent)
applications:
  - name: cockpit

  # A tenant-owned copy of a built-in web application, kept at the latest
  # release: created when missing (in place of the application owned by the
  # management tenant) and re-uploaded whenever the release version differs
  # from the application manifest.version
  - name: devicemanagement
    source:
      github:
        repo: Cumulocity-IoT/devicemanagement
        tags: ["v1025.*"]
        includePrereleases: true
        assets: ["devicemanagement-*.zip"]
    # Delete the oldest binaries after an upload so only the latest 3 remain
    # (the active binary is always kept)
    keepBinaries: 3
    # Install UI extensions into the tenant-owned copy (additive: extensions
    # installed by hand are kept). "<name>[@<version or tag>]" defaults to
    # the latest version; installed: false removes an extension.
    extensions:
      - my-widget-plugin
      - name: old-widget-plugin
        installed: false

# Create a tree of device groups (regions, sites, production lines, ...). A
# group is identified by its name within its parent; missing groups are created
# and linked to their parent as child assets. description and fragments are
# only updated when they differ. Groups are never deleted or unlinked.
deviceGroups:
  - name: Europe
    description: European sites
    fragments: # optional extra fragments merged into the managed object
      customer_Region:
        code: EU
    groups:
      - name: Plant Berlin
        groups:
          - name: Line 1
          - name: Line 2

# Create user groups (called "global roles" in the UI) with roles assigned.
# Role assignments are additive: roles already on a group but absent from the
# manifest are kept, so built-in groups can be extended safely.
userGroups:
  - name: operators
    description: Read-only access for the operations team
    roles:
      - ROLE_INVENTORY_READ
      - ROLE_ALARM_READ
      - ROLE_EVENT_READ

# Create inventory roles: permissions which users get only on the devices of
# specific device groups (see users[].inventoryAssignments). Roles are matched
# by name; the permissions are replaced when the set differs. scope: ALARM,
# AUDIT, EVENT, MANAGED_OBJECT, MEASUREMENT, OPERATION or *; type defaults to
# *; permission: READ, ADMIN or * (ALL)
inventoryRoles:
  - name: Site operator
    description: Alarms and operations for one site
    permissions:
      - {scope: ALARM, permission: ADMIN}
      - {scope: OPERATION, permission: ADMIN}
      - {scope: MEASUREMENT, permission: READ}
      - {scope: MANAGED_OBJECT, permission: READ}
  - name: Restart only
    permissions:
      - {scope: OPERATION, type: c8y_Restart, permission: ADMIN}

# Create users and assign them to user groups. The password is only used when
# creating a user (never updated afterwards); group memberships are additive.
users:
  # The userName defaults to the email (and the email to an email-like
  # userName when the user is created)
  - email: jdoe@example.com
    firstName: Jane
    lastName: Doe
    sendPasswordResetEmail: true # email a reset link instead of setting a password
    groups: [operators]

  - userName: svc-dashboard
    email: ops@example.com # required to create a user whose userName is not an email
    password: ${DASHBOARD_USER_PASSWORD} # injected from the environment
    groups: [operators]

  # A random initial password, stored in tenant.secrets.yaml (encrypted with
  # sops when a .sops.yaml is found) and masked in the output. passwordFrom
  # is a separate field, so sops rules on "password" leave it readable
  - email: svc-monitoring@example.invalid
    passwordFrom:
      generate: svc-monitoring-password # or: env: MONITORING_PASSWORD
    groups: [operators]

  # A site operator who only sees the devices of one site. The device group is
  # looked up by name (or by a path such as Europe/Plant Berlin) and must
  # exist; missing roles are added, existing ones are never removed
  - email: berlin-ops@example.com
    sendPasswordResetEmail: true
    inventoryAssignments:
      - group: Plant Berlin
        roles: [Site operator, Restart only]

  - userName: old-account@example.com
    enabled: false # keep the account but disable it

# Login options: the preferred login mode of the login page (oaiSecure, basic
# or sso) and the settings of each login option. Login options are never
# deleted; the preferred mode is switched last, only once the new option is
# configured and checked (see "Login options" in the README). The values
# below are the defaults of a new tenant.
loginOptions:
  preferred: oaiSecure
  oaiSecure:
    session:
      absoluteTimeout: 336h
      renewalTimeout: 24h
  # Single sign-on generated from the provider's OpenID Connect discovery
  # document: only the client ID, the secret and the mappings are declared
  # sso:
  #   discoveryUrl: https://idp.example.com/realms/acme/.well-known/openid-configuration
  #   clientId: cumulocity
  #   clientSecretFrom:
  #     env: SSO_CLIENT_SECRET
  #   userIdClaim: preferred_username
  #   accessMappings:
  #     rules:
  #       - when:
  #           - claim: groups
  #             operator: IN
  #             value: c8y-admins
  #         groups: [admins]

# Sync software packages. Name, version, architecture and software type are
# parsed from the filenames (same logic as the software-uploader example).
software:
  # An explicit entry: a single version declared by name, without a source.
  # Without url, the version has an empty url (e.g. for packages which devices
  # install from their package repositories)
  - name: tedge
    version: latest
    type: apt

  # From a local directory (searched recursively)
  - source:
      path: ./packages
      patterns: ["*.deb", "*.rpm", "*.apk", "*.ipk"]

  # From the latest GitHub release of a repository
  - source:
      github:
        repo: thin-edge/tedge-container-bundle
        release: latest # or "latest-N" (e.g. "latest-5"), a tag (e.g. "1.2.0"), or "all"
        assets: ["*.deb"]
        token: ${GITHUB_TOKEN} # optional, required for private repos

  # The latest tedge and tedge-agent packages from the public thin-edge.io
  # Cloudsmith repository (also thinedge/tedge-main and thinedge/community).
  # Name, version and type come from the package metadata. The versions have
  # no url, so the device's package manager installs them from its configured
  # repositories (binary: link or upload references the package instead)
  - source:
      cloudsmith:
        repo: https://broadcasts.cloudsmith.com/thinedge/tedge-release
        packages: [tedge, tedge-agent]
        formats: [deb, alpine]
        architectures: [arm64, aarch64]
        version: latest # or "latest-N", "all", or an exact version
        binary: auto    # none for deb/rpm/alpine, link for raw packages

  # The latest release of each component of a monorepo which publishes a
  # release per component (e.g. release-please tags like c8y-deploy-poll-v0.6.1)
  - source:
      github:
        repo: thin-edge/tedge-flows-examples
        tags: ["c8y-deploy-poll-v*", "c8y-deploy-status-v*"] # or ["{component}-v*"] for every component
        release: latest # per tag pattern (or per {component})
        assets: ["*.tar.gz"]
        linkOnly: true

  # Reference release assets by URL instead of uploading the binaries
  # (only works for public repositories)
  - namePrefix: "linked-"
    source:
      github:
        repo: cli/cli
        assets: ["gh_*_linux_arm64.deb"]
        linkOnly: true

# Sync firmware (OS images). Versions are parsed from common build system
# naming conventions (Yocto, Buildroot, Rugix Bakery, SWUpdate, RAUC, Mender)
# with fallback to the GitHub release tag.
firmware:
  # Yocto images from a local build directory. The deviceType supports
  # {name}, {version} and {filename} placeholders derived from each artifact.
  - deviceType: "{name}"
    source:
      path: ./tmp/deploy/images/raspberrypi4-64
      patterns: ["*.rootfs.wic.bz2"]
      optional: true # skip instead of failing when the build dir is missing

  # Rugix Bakery images from GitHub releases; the release tag is used as the
  # version when the filename does not contain one. Firmware from GitHub is
  # linked by URL by default (devices download it from GitHub); set
  # linkOnly: false to upload the images to Cumulocity instead
  - name: tedge-rugix-pi
    description: thin-edge.io Rugix image for Raspberry Pi
    deviceType: rugix-pi
    source:
      github:
        repo: thin-edge/tedge-rugix-image
        release: latest-5 # mirror the most recent five releases
        assets: ["*.img.xz"]

  # An explicit entry: a single version declared with name and version
  # (and an optional url) instead of a source
  - name: vendor-os
    version: 3.1.0
    deviceType: vendor-gateway
    url: https://example.com/firmware/vendor-os-3.1.0.swu

  # Custom firmware naming scheme: extract the version with a regex
  - deviceType: model7
    versionPattern: 'BUILD(\d+)'
    source:
      path: ./firmware
      patterns: ["FW_MODEL7_*.custom"]

# Sync configuration files into the configuration repository
configuration:
  # An explicit entry with inline content, uploaded as a file (${VAR} is
  # expanded, and the content can be encrypted with sops)
  - name: tedge-mosquitto
    configurationType: mosquitto.conf
    deviceType: thin-edge.io
    filename: mosquitto.conf
    force: true # re-upload on every run, so content changes are applied
    content: |
      listener 1883
      allow_anonymous false

  - name: mosquitto
    configurationType: mosquitto.conf
    description: Default mosquitto configuration
    deviceType: thin-edge.io
    source:
      path: ./config/mosquitto.conf

  # Reference an external URL without uploading a binary
  - name: tedge-default
    configurationType: tedge.toml
    source:
      url: https://example.com/configs/tedge.toml

# Sync SmartREST 2.0 template collections from JSON files exported by the
# platform (one collection per file). Collections are matched by their
# external identity (X-Id) and only updated when they differ from the file —
# the order of the templates inside a file does not matter.
smartrestTemplates:
  # Scan a directory (*.json by default)
  - source:
      path: ./smartrest
      optional: true # skip instead of failing when the directory is missing

  # A single exported collection, with the name from the manifest instead of
  # the file
  - name: custom_devmgmt
    source:
      path: ./exports/custom_devmgmt.json
      optional: true

# Digital Twin Manager definitions, inline or from definition files (JSON/YAML
# as returned by the DTM API). Property definitions are applied before the
# asset definitions using them, and definitions are only written when they
# differ.
digitalTwin:
  managedBy: tenant-sync # tag added to every definition the sync writes
  # prune: true          # delete definitions tagged managedBy which are no longer declared
  propertyDefinitions:
    # Definition files (JSON/YAML as returned by the DTM API)
    - source:
        path: ./dtm/properties
        optional: true
    # Or a single file by URL
    - source:
        url: https://raw.githubusercontent.com/thin-edge/tiny-edge/refs/heads/main/cumulocity/dtm/tiny_edge_remote_access.json
    # Or inline
    - identifier: maxFlow
      contexts: [asset]
      jsonSchema: {title: Maximum flow, type: number, minimum: 0}
  assetDefinitions:
    - identifier: Pump
      jsonSchema: {title: Pump}
      composition:
        allowedProperties:
          - identifier: maxFlow

# Deploy Data Preparation smart functions (rules) from package folders
# (data-prep.yaml, the smart function and tests/*.yaml) or .tar.gz archives
# exported by the Data Preparation application. A rule is only deployed when
# its code, configuration or tests changed.
smartFunctions:
  - source:
      path: ./smartfunctions
      optional: true
    waitTimeout: 2m # wait for the deployment to finish (default 60s)

  # Or an inline rule, declared in the manifest
  - name: firmware-progress
    description: Firmware download progress to c8y_FirmwareDownload events
    input:
      topicPattern: "te/device/*///progress/firmware"
    code: |
      export function onMessage(message, context) {
        const data = JSON.parse(new TextDecoder().decode(message.payload));
        return [{
          cumulocityType: 'event',
          payload: { type: 'c8y_FirmwareDownload', text: `Firmware download: ${data.percent}%`, time: message.time },
          externalSource: [{ externalId: message.clientID, type: 'c8y_Serial' }],
        }];
      }
    tests:
      downloading:
        inputs:
          - topic: te/device/dev01///progress/firmware
            clientID: dev01
            payload: {percent: 40}
            time: "2026-01-01T00:00:00Z"

# Create device profiles referencing the items synced above.
# Binary URLs are resolved automatically from the tenant (which is why this
# section runs after software/firmware/configuration), or given explicitly
# with url to skip the lookup.
deviceProfiles:
  - name: rpi4-base
    deviceType: raspberrypi4-64
    firmware:
      name: core-image-tedge-raspberrypi4-64
      version: "20240115103000"
    software:
      - name: tedge
        version: 1.6.2
        type: apt # optional software type (disambiguates the lookup)
        action: install
      # An explicit url skips the repository lookup (externally hosted binary)
      - name: sensor-agent
        version: 2.1.0
        url: https://example.com/packages/sensor-agent_2.1.0.deb
      # url: none (or "-") skips the lookup AND leaves the url off the profile
      # (for devices that resolve artifacts by name/version themselves)
      - name: managed-by-device
        version: 3.0.0
        url: none
    configuration:
      - name: mosquitto
        type: mosquitto.conf

  # versionSelector picks a version from the tenant by semver on every run:
  # latest, latest-N (latest-1 = second latest) or a semver constraint such as
  # ^1.6 (prereleases such as 1.2.0-rc1 only with includePrereleases: true)
  - name: rpi4-latest
    deviceType: raspberrypi4-64
    firmware:
      name: core-image-tedge-raspberrypi4-64
      versionSelector: latest
    software:
      - name: tedge
        type: apt
        versionSelector: ^1.6

# Named groups of shell commands, run as the last section. Actions within a
# group run in sequence (a failing action skips the rest of its group);
# separate groups run concurrently with each other.
commands:
  - name: seed-devices
    actions:
      - echo "c8y devices create --name foo"
      - echo "c8y devices create --name foo2"
  - name: smoke-test
    actions:
      - echo "c8y currenttenant get"

# Commands executed around the sync (via 'sh -c', from the manifest directory,
# with C8Y_* env vars passed through). A failing pre hook aborts the run; post
# hooks always run and report failures without aborting. Section hooks
# (hooks.sections.<name>) run around a single section and are skipped when the
# section is excluded by --only.
hooks:
  pre:
    - name: show session
      run: echo "Syncing tenant $C8Y_TENANT"
  post:
    - run: echo "Sync finished"
  sections:
    software:
      pre:
        - run: echo "before the software section"
      post:
        - run: echo "after the software section"
